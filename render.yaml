services:
  - type: web
    name: pin-mls-api
    runtime: docker
    dockerfilePath: ./deploy/render/Dockerfile.backend
    dockerContext: .
    plan: free
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pin-mls-redis
          property: connectionString
      - key: JWT_PRIVATE_KEY_PEM
        sync: false
      - key: JWT_PUBLIC_KEY_PEM
        sync: false
      - key: POW_SECRET_HEX
        generateValue: true
      - key: COOLDOWN_SECRET_HEX
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

  - type: keyvalue
    name: pin-mls-redis
    plan: free
    ipAllowList: []

  - type: web
    name: pin-mls-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
