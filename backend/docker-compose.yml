name: pin-mls-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pinmls
      POSTGRES_USER: pinmls
      POSTGRES_PASSWORD: pinmls_dev
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinmls -d pinmls"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "noeviction"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    command: ["/bin/sh", "/app/sql/migrate.sh"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    # Enlazado solo a loopback porque el VPS aún no tiene dominio/TLS (acceso vía túnel SSH)
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    command: ["node", "dist/worker.js"]

volumes:
  pg_dev_data:
  redis_dev_data:
