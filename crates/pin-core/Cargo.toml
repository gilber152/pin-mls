[package]
name = "pin-core"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64 = "0.22"
bip39 = { version = "2.0", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
hkdf = "0.12"
openmls = { version = "0.9", features = ["js"] }
openmls_basic_credential = "0.6"
openmls_memory_storage = { version = "0.6", features = ["persistence"] }
openmls_rust_crypto = "0.6"
openmls_traits = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tls_codec = "0.5"
uuid = { version = "1.10", features = ["v4", "js"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }
